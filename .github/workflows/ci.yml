name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check BB SDK surface
        run: npx --no-install bb plugin types --check

      - name: Run lint, format, Knip, typecheck, tests, and build
        run: npm run check

  stress:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run five loaded suites with one burner per available CPU
        run: npm run test:stress

      - name: Save timings and verbose failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-stress-results
          path: /tmp/sb11-tests-*
